name: Release to GitHub Pages

# 正式版的**唯一入口**：在 GitHub 网页上发布一个 Release
# （Releases → Draft a new release → 选/建 tag → Publish release）。
#
# 触发方式从「推 tag」改成了「发布 Release」：推 tag 现在只跑 ci.yml 做构建校验
# （见 ci.yml 的 push.tags），发布必须有人在网页上点一次 Publish。
# 顺带的好处是发布记录、变更说明、产物和线上版本天然对得上。
#
# ⚠️ published 事件对「预发布（prerelease）」同样会触发 —— GitHub 文档明确写了
#    「If you want a workflow to run when stable and pre-releases publish,
#     subscribe to published instead of released and prereleased」。
#    所以下面必须用 if 把 nightly.yml 的滚动预发布挡掉：
#    否则每推一次 main，nightly 都会把预发布内容发到正式站点上。
#    （日常不会有这个问题：nightly 用的是 GITHUB_TOKEN，而 GITHUB_TOKEN 触发的事件
#     不会产生新的工作流运行。这道 if 防的是「人手动发了个预发布」和 PAT 那条路。）
on:
  release:
    types: [published]

# GitHub Pages 部署所需权限：OIDC 令牌 + Pages 写入。
# 注意这里**没有** contents: write —— 发布正式版不需要动仓库内容。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一次部署；发布不做 cancel-in-progress，
# 避免出现「发布到一半被取消」的半成品站点。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    # 只接「正式版 + v* tag」的 Release；预发布（nightly）在这里被跳过。
    # 服务端 github-pages 环境的 Deployment branches and tags 也是只放行 v* 的 tag，
    # 而 release 事件的 github.ref 正是 refs/tags/<tag>，所以两道口子对得上。
    if: >-
      !github.event.release.prerelease &&
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 发布的是 tag 指向的那次提交，不是分支头
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------- 版本一致性校验 ----------
      # tag 与 package.json 版本必须一致，避免「v1.2.0 的站点里写着 1.1.9」。
      # 发布路径上必查：Release 可以在网页上顺手建一个新 tag，那条路不经过 ci.yml。
      # tag 名走 env 传进脚本，不做字符串拼接（避免奇怪字符注入 shell）。
      - name: 校验 tag 与 package.json 版本一致
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "v$PKG" != "$TAG" ]; then
            echo "::error::Release 的 tag ($TAG) 与 package.json 版本 (v$PKG) 不一致：先 npm version 并推送，再重新发布 Release"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: npm ci

      - name: 校验烘焙贴图资产
        run: |
          for f in board door-sign keyboard; do
            test -s "assets/textures/$f.webp" \
              || { echo "::error::缺少 assets/textures/$f.webp，请运行 npm run bake:assets"; exit 1; }
          done

      # 发布前把校验全跑一遍：宁可不发布，也不发布一个坏的站点。
      - name: ESLint
        run: npm run lint

      - name: 回归测试
        run: npm test

      - name: 构建（把版本号注入产物）
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      # Pages 需要 .nojekyll，否则以 _ 开头的文件/目录会被 Jekyll 忽略
      - name: 写入 .nojekyll
        run: touch dist/.nojekyll

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 发布摘要
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "### 已发布 v$VERSION"
            echo ""
            echo "- 站点：${{ steps.deployment.outputs.page_url }}"
            echo "- Release：${{ github.event.release.html_url }}"
            echo "- 触发：\`$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
