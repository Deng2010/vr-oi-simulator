name: CI

# 只做校验，绝不发布。
#   · PR / 主干推送 → 校验
#   · tag 推送      → 也只校验（顺手拦一道「tag 与 package.json 对不上」）
#   · 发布正式版    → 必须在网页上手动发 Release，见 release.yml
#   · 发布 nightly  → push 到 main 时另行滚动发布预发布，见 nightly.yml
# 这样往 main 上推任何提交都不会意外覆盖线上 Pages。
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / test / build / smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # tag 推送时先拦一道低级错误：tag 与 package.json 版本对不上。
      # 否则要等到你手动发 Release 那一刻才失败，等于白推一轮。
      # （release.yml 里还有同一道校验 —— 网页上新建 tag 的路径不经过这里。）
      - name: 校验 tag 与 package.json 版本一致（仅 tag 推送）
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "v$PKG" != "$TAG" ]; then
            echo "::error::tag ($TAG) 与 package.json 版本 (v$PKG) 不一致，请先同步版本号再打 tag"
            exit 1
          fi

      - name: 安装依赖
        run: npm ci

      - name: 校验烘焙贴图资产（缺失会让构建直接失败，这里给出更清晰的报错）
        run: |
          for f in board door-sign keyboard; do
            test -s "assets/textures/$f.webp" \
              || { echo "::error::缺少 assets/textures/$f.webp，请运行 npm run bake:assets"; exit 1; }
          done

      - name: ESLint
        run: npm run lint

      - name: 回归测试（评分/NPC 确定性、题面哈希、依赖方向）
        run: npm test

      - name: 构建
        run: npm run build

      - name: 产物体积报告
        run: |
          {
            echo "### 构建产物体积"
            echo '```'
            find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.webp' \) \
              -exec ls -l {} \; | awk '{printf "%9d  %s\n", $5, $9}' | sort -rn
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # WebGL 端到端冒烟测试：真浏览器跑一遍
      # 「初始化 → 开始比赛 → 准星交互 → 打开 IDE → 题面懒加载 → 提交评测 → 设置面板」。
      # ESLint 只能证明名字解析得对，证明不了模块接线与懒加载路径没断。
      - name: 安装无头 Chromium（仅用于冒烟测试）
        run: npx --yes playwright@1.47.2 install --with-deps chromium

      - name: 浏览器端到端冒烟测试
        run: node tools/smoke-test.mjs

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
