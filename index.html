<style>
  html,body{margin:0;height:100%;background:#07090d;color:#d7dce8;
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  #boot{position:fixed;inset:0;display:grid;place-items:center;z-index:999;
    font-size:13px;letter-spacing:2px;color:#7c869c;background:#07090d;
    transition:opacity .25s;}
  #boot.done{opacity:0;pointer-events:none;}
  #boot .err{max-width:520px;padding:0 24px;text-align:center;line-height:2;color:#ff8f8f;}
  #boot code{color:#aab3c5;font-size:12px;}
